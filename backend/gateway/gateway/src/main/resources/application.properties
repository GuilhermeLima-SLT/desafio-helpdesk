spring.application.name=gateway
server.port=8004

eureka.client.serviceUrl.defaultZone=http://localhost:8003/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

// Desabilitada a descoberta automática de serviços pelo gateway, pois estamos definindo rotas explícitas
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

// Configurações do Springdoc para habilitar a documentação da API e a interface Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Rotas explícitas retornaram para condizer com chamadas do frontend
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=ticket-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ticket-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/tickets/**

spring.cloud.gateway.server.webflux.routes[2].id=notification-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/notifications/**

# CORS para o frontend chamar pelo gateway
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins=http://localhost:5173,http://localhost:8080
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers=*